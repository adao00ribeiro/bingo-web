
  <div class="container bg-primary">
    <h1>Login</h1>
    <span>B1NGO PIX ON-LINE</span>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="formgroup">
        <mat-form-field class="example-full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" />
        </mat-form-field>
        <mat-form-field class="example-full-width">
          <mat-label>Senha</mat-label>
          <input matInput type="password"formControlName="password" />
        </mat-form-field>
      </div>
      <div class="containerRegistrarRecuperar">
        <button type="submit" mat-flat-button class="btn-primary">Logar</button>
        <a class="a-primary" routerLink="/cadastro" >Registrar</a>
      </div>
    </form>
    <div class="container18pix">
      <img src="/images/+18.png" alt="18" />
      <img src="/images/pix.png" alt="pix" />
    </div>
  </div>
