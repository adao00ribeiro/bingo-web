<div class="container" [class.is-mobile]="mobileQuery.matches">
  <mat-toolbar color="primary" class="toolbar">
    <button mat-icon-button (click)="snav.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
    <h1>Dashboard</h1>
    <span class="spacer"></span>


    <!-- Botão de Notificações -->
    <button mat-icon-button [matBadge]="unreadNotifications()"
            [matBadgeHidden]="unreadNotifications() === 0"
            (click)="showNotifications()">
      <mat-icon>notifications</mat-icon>
    </button>
  </mat-toolbar>

  <mat-sidenav-container class="sidenav-container"
                       [style.marginTop.px]="mobileQuery.matches ? 56 : 0">
    <mat-sidenav #snav [mode]="mobileQuery.matches ? 'over' : 'side'"
                [fixedInViewport]="mobileQuery.matches" fixedTopGap="56">
      <mat-nav-list>
        <a mat-list-item (click)="handleClick('/dashboard')">Dashboard</a>
        <a mat-list-item (click)="handleClick('/rounds')">Rounds</a>
        <!-- Adicione mais items conforme necessário -->
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content>
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
