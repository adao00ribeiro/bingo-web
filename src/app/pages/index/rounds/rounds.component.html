@if(false){
<app-carousel
[imagens]="[
'https://picsum.photos/id/17/2500/1667',
'https://picsum.photos/id/18/2500/1667',
'https://picsum.photos/id/19/2500/1667'
]"
></app-carousel>
}
<button (click)="testResourceClick()">CLICA</button>

@if (RoundsByRoomIdResourceService.resource.isLoading()) {
    <span >Carregando...</span>
}@else {
  <div class="grid">
    @for (item of  RoundsByRoomIdResourceService.resource.value(); track $index) {
      <app-card-round [round]="item" [roundSocket]="this.roundsRealTimeService.getRoundSignal()(item.roomId,item.id)"></app-card-round>
    }
  </div>
}
