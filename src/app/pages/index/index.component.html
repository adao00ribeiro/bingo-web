<div class="example-container" [class.example-is-mobile]="mobileQuery.matches">
  <mat-toolbar class="example-toolbar bg-primary">
    <div class="toolbar-left">
      <button mat-icon-button (click)="toggleSidenav()">
        <mat-icon class="text">menu</mat-icon>
      </button>
      <h1 class="example-app-name text">Bingo</h1>
    </div>
    <div class="toolbar-right">
      <button class="btn-visibility" (click)="handleVisibity()">
        <mat-icon>{{ isVisible ? 'visibility' : 'visibility_off' }}</mat-icon>
      </button>
      <button class="btn-wallet" [matMenuTriggerFor]="belowMenuDeposit">
        {{ isVisible ? (user?.balance | currency) : 'R$#####' }}
      </button>
      <mat-menu class="mat-menu-item" #belowMenuDeposit="matMenu" yPosition="below"  >
        <button mat-menu-item (click)="deposit()">
          <mat-icon>payments</mat-icon>
          Depositar</button>
        <button mat-menu-item (click)="wallet()">
          <mat-icon>wallet</mat-icon>
          Carteira</button>
      </mat-menu>

      <button class="btn-user" [matMenuTriggerFor]="belowMenu">
        <mat-icon>person</mat-icon>
      </button>
      <mat-menu class="mat-menu-item" #belowMenu="matMenu" yPosition="below"  >
        <button mat-menu-item (click)="myAccount()">
          <mat-icon>person</mat-icon>
          Minha Conta
        </button>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          Sair
        </button>


      </mat-menu>
    </div>
  </mat-toolbar>
  <mat-sidenav-container
    class="example-sidenav-container"
    [style.marginTop.px]="mobileQuery.matches ? 56 : 0"
  >
    <mat-sidenav
      class="bg-primary"
      [opened]="isSidenavOpen"
      #snav
      [mode]="mobileQuery.matches ? 'over' : 'side'"
      [fixedInViewport]="mobileQuery.matches"
      fixedTopGap="56"
    >
      <mat-nav-list>
        <app-button-menu descricao="Rodadas" (onClick)="handleClick('/')">
          <mat-icon>list_alt</mat-icon>
        </app-button-menu>
        <app-button-menu
          descricao="Meus Premios"
          (onClick)="handleClick('/premios')"
        >
          <mat-icon>military_tech</mat-icon>
        </app-button-menu>
        <app-button-menu
          descricao="Minhas Recargas"
          (onClick)="handleClick('/recargas')"
        >
          <mat-icon>paid</mat-icon>
        </app-button-menu>
      </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content class="routeoutlet">
      <div class="router-container bg-primary">
        <router-outlet ></router-outlet>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
