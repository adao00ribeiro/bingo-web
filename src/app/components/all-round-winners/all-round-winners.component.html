<div class="container-all-winners">
  <h1>Ganhadores</h1>
  <div class="all-winners">
    <div class="prize" *ngFor="let prize of prizeResults; let index = index">
      <h5>{{ index + 1 }}º Premio</h5>
      <div class="grid">
        <div *ngFor="let winner of prize.winning_cards" class="card">
          <h4>{{ winner.cards.id }}</h4>
          <span>{{ winner.reseller.name }}</span>
          <p>{{ 20 }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
