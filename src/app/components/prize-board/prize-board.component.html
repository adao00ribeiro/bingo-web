<table class="custom-prize-table">
  <thead class="scrollable-thead">
    <tr>
      <th>Premios</th>
      <th></th>
    </tr>
  </thead>
  <tbody class="scrollable-tbody">
    @for (prize of prizeResults(); track $index) {
    <tr [class.line-through]="prize.winningCards.length > 0">
      <td>{{ prize.prizeType }}</td>
      <td>{{ prize.value | currency }} </td>
    </tr>
    }
  </tbody>
</table>
