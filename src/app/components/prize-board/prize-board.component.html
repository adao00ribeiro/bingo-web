  <div class="premios-carousel">
    <div class="carousel-container">
       @for (prize of prizeResults(); track $index) {
      <div class="premio-card" [class.disabled]="prize.winningCards.length > 0">
        <h4>{{ prize.prizeType }}</h4>
        <p>{{ prize.value | currency}}</p>
      </div>
        }
    </div>
  </div>
