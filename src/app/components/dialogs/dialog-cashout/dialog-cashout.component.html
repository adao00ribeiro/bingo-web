<mat-dialog-content class="dialog">
      <h2 >Novo Saque</h2>
      <div class="info-saque">
        <span>Saldo Disponivel</span>
        <span>{{punterMeResource.resource.value()?.prizeBalance| currency}} </span>
      </div>
      <form class="form" [formGroup]="depositForm">
          <mat-form-field class="example-full-width">
            <mat-label>Valor</mat-label>
            <input matInput formControlName="value" >
          </mat-form-field>
      </form>
</mat-dialog-content>
<mat-card-actions >
  <button  (click)="onNoClick()">Cancelar</button>
  <button  (click)="handleWithdrawalClick()">Sacar</button>
</mat-card-actions>
