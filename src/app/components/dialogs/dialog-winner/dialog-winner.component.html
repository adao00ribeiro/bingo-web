<mat-dialog-content class="dialog bg-primary">
<!-- round-winner.component.html -->
<div class="container-round-winner">
  <h1>{{ getTitle() }}</h1>
  <div class="grid">
    @for (wc of winningCards; track $index) {
    <div class="card-prize">
      <h1>{{ wc.reseller.name }}</h1>
      <app-card [card]="wc.cards" [balls]="numbers"></app-card>
      <span>{{ wc.value_of_each_winner | currency }}</span>
    </div>
  }
  </div>
</div>

</mat-dialog-content>
