<mat-dialog-content class="dialog bg-primary">
  <mat-card class="example-card" appearance="outlined">
    <mat-card-header>
      <h1 class="text-black">Novo Deposito</h1>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="depositForm" >
        <div class="formgroup">
          <mat-form-field class="example-full-width">
            <mat-label>Valor</mat-label>
            <input matInput type="value"formControlName="value" />
          </mat-form-field>
        </div>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <button class="btn-second"  (click)="onNoClick()">CANCELAR</button>
      <button class="btn-primary" (click)="handleDepositClick()">DEPOSITAR</button>
    </mat-card-actions>
  </mat-card>
</mat-dialog-content>
