<mat-dialog-content class="dialog">

  <h2 class="text-white">Novo Deposito</h2>

  <form class="form" [formGroup]="depositForm">
    <mat-checkbox class="example-margin" formControlName="useCrypto">
      Usar Criptomoeda
    </mat-checkbox>
    <mat-form-field class="example-full-width">
      <mat-label>Valor</mat-label>
      <input matInput formControlName="value" currencyMask [options]="{ prefix: 'R$ ', thousands: '.', decimal: ',', align: 'right' }">
    </mat-form-field>
  </form>

</mat-dialog-content>
<mat-card-actions>
  <button class="btn-second" (click)="onNoClick()">CANCELAR</button>
  <button class="btn-primary" (click)="handleDepositClick()">DEPOSITAR</button>
</mat-card-actions>
