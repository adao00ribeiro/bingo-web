<form [formGroup]="form"  class="container">
   <mat-card class="card">
        <mat-card-header class="chat-header">
            <mat-card-title class="chat-title">Chat</mat-card-title>
        </mat-card-header>
        <mat-card-content class="chat-content" #messageContainer>
          @for (message of messages(); track $index) {
           <div  class="messages">
                <div [ngClass]="'message ' + message.type">
                    {{ message.text }}
                </div>
            </div>
          }
        </mat-card-content>
        <mat-card-actions class="chat-actions">
            <mat-form-field  class="chat-form">
            <textarea
                class="chat-input"
                matInput
                type="text"
                placeholder="Type message..."
                formControlName="message"
                (keydown.enter)="onClickEnter()"

            ></textarea>
            <button
                class="send-button"
                matSuffix
                mat-icon-button
                aria-label="Send"
                (click)="onClickSendMessage()"
                [disableRipple]="true"
            >
                <mat-icon class="send-icon">send</mat-icon>
            </button>
            </mat-form-field>
        </mat-card-actions>
    </mat-card>
</form>
