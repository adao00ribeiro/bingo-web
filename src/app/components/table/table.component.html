<section class="container " tabindex="0">
  <mat-form-field class="input-filter">
    <mat-label>Filter</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ex. ium" #input>
  </mat-form-field>
  <table class="mat-mdc-table" mat-table [dataSource]="dataSource">
    @for (columns of columnMappings; track $index) {
      <ng-container [matColumnDef]="columns.key">
        <th mat-header-cell *matHeaderCellDef>{{columns.displayName }} </th>
        <td mat-cell *matCellDef="let element">
          @if(columns.pipe){
            {{element[columns.key] | dynamic: columns.pipe }}
          }@else {
            {{element[columns.key]}}
          }
        </td>
      </ng-container>
    }
    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</section>
<mat-paginator [pageSizeOptions]="[5, 10, 20]"
showFirstLastButtons
aria-label="Select page of periodic elements">
</mat-paginator>
