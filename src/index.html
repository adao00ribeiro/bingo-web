<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Web</title>
  <base href="%BASE_HREF%">
  <base href="/">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Meta Tags Básicas -->
  <meta name="description" content="Este é um exemplo de como adicionar meta tags OG em um aplicativo Angular.">
  <meta name="keywords" content="angular, bingo, aplicativo, jogo">
  <meta name="author" content="Meu Site">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Meu Aplicativo Angular: Compartilhando em Redes Sociais">
  <meta property="og:description" content="Este é um exemplo de como adicionar meta tags OG em um aplicativo Angular.">
  <meta property="og:image" content="https://homologation-bingo-web.srv813210.hstgr.cloud/images/Icone.png">
  <meta property="og:image:alt" content="Ícone do Meu Aplicativo Angular">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://homologation-bingo-web.srv813210.hstgr.cloud">
  <meta property="og:site_name" content="Meu Site">
  <meta property="og:locale" content="pt_BR">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Meu Aplicativo Angular: Compartilhando em Redes Sociais">
  <meta name="twitter:description" content="Este é um exemplo de como adicionar meta tags OG em um aplicativo Angular.">
  <meta name="twitter:image" content="https://homologation-bingo-web.srv813210.hstgr.cloud/images/Icone.png">

  <!-- WhatsApp específico -->
  <meta property="og:image:type" content="image/png">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://homologation-bingo-web.srv813210.hstgr.cloud">
</head>
<body>
  <app-root></app-root>
</body>
</html>
